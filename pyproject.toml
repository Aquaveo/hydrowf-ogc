[project]
name = "hydrowf-platform"
version = "0.1.0"
description = "hydrowf backend: OGC API - Processes plugins, publishing"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.44.5",
  "hydrowf-core[argo,auth]",
  "pygeoapi>=0.24,<0.25",
  "starlette>=1.10.0",
  "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "flake8>=7",
    "httpx>=0.28.1",
]

[tool.uv.sources]
hydrowf-core = { git = "https://github.com/Aquaveo/hydrowf-core", rev = "368115e" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
